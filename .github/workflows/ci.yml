name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint, tipos, testes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: disciplina_test
          POSTGRES_USER: disciplina
          POSTGRES_PASSWORD: disciplina
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U disciplina -d disciplina_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests alembic
      - run: ruff format --check app tests alembic
      - run: mypy app
      - run: pytest -q
        env:
          ENV: test
          DATABASE_URL: postgresql+asyncpg://disciplina:disciplina@127.0.0.1:5432/disciplina_test
          JWT_SECRET: segredo-de-teste-com-mais-de-trinta-e-dois-caracteres
          COOKIE_SECURE: "false"

  frontend:
    name: Frontend (tipos, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build
